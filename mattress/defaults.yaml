# MATTRESS default configuration. Every key can be overridden on the command line:
#   mattress run in out --set faces.enabled=false --set damage.max_area_review=0.05

device: cuda            # cuda | cpu
models_dir: models
tile_size: 512          # GPU tile size for LaMa / Real-ESRGAN
jpeg_quality: 95

detect:
  work_dpi: 100         # detection runs on a downsampled copy at this dpi
  assumed_dpi: 600      # used when the file has no dpi tag
  min_print_in: 1.0     # ignore objects whose short side is under this many inches
  bg_diff_thresh: 10    # 8-bit difference from lid model to count as "print"
  min_rectangularity: 0.88   # contour area / minAreaRect area
  min_confidence: 0.6   # below this a page goes to review (and SAM fallback if enabled)
  sam_fallback: false   # needs `pip install transformers`; slow, only used on low-confidence pages
  edge_snap_px: 4       # max px (at work dpi) a side may move when snapping to an edge
  max_print_long_in: 9.5  # a region longer than this (or more elongated than max_print_aspect)
  max_print_aspect: 1.9   # is assumed to be several prints and split at the strongest boundary

geometry:
  trim_pct: 0.3         # trim this % of each side after crop to lose lid slivers
  refine_max_deg: 2.0   # max extra tilt correction applied from Hough refine

orient:
  enabled: true
  min_margin: 0.15      # best-vs-second score gap; below this the photo is flagged
  prior_upright: 0.05   # bonus added to the 0-degree hypothesis
  clip_model: ViT-B-32
  clip_pretrained: laion2b_s34b_b79k

bw:
  chroma_thresh: 6.0    # LAB chroma (after cast removal) counted as "coloured"
  colour_frac: 0.06     # fraction of coloured pixels needed for "colour"
  hue_spread_deg: 25    # coloured pixels with a tighter hue spread than this = toned mono

fade:
  enabled: true
  min_range: 0.70       # p1..p99 luminance range below this => faded
  min_saturation: 0.12  # mean chroma (normalised) below this => desaturated (colour only)
  max_cast: 0.07        # channel-mean imbalance above this => colour cast
  stretch_pct: [0.3, 99.8]
  wb_strength: 0.35     # 0..1 blend toward neutral white balance (high values over-correct)
  sat_boost_max: 1.12
  clahe_clip: 0         # local contrast boost; 0 = off (it exaggerates stains and scratches)
  strength: 0.6         # final mix of corrected over original

damage:
  enabled: true
  speck_max_px: 600     # largest dust/speck component area (at 600 dpi)
  speck_contrast: 30    # 8-bit narrow top-hat response to count as dust
  speck_max_chroma: 15  # LAB chroma; dust is colourless, coloured dots are picture content
  speck_snr: 5.0        # dust must stand this many times above local grain
  scratch_min_len_px: 200   # ~1/3 inch at 600 dpi
  people_lines_only: true  # on people only long thin scratches are repaired (not specks/blobs)
  dark_scratches: false # dark straight lines are usually wires/frames, not damage
  min_area: 0.0002      # inpaint only if mask covers more than this fraction
  max_area_review: 0.03 # mask fraction above this => flag "heavy damage" for review
  dilate_px: 3

scratches:              # learned scratch / fold / crack detector (Microsoft BOPBTL, MIT)
  enabled: true
  scale_coarse: 512     # short side for folds, creases, larger scratches
  thresh_coarse: 0.4
  scale_fine: 1024      # short side for fine scratches - kept only when very confident
  thresh_fine: 0.75
  dilate_frac: 0.0015   # grow the mask so LaMa covers scratch edges

upscale:
  enabled: true
  max_long_edge: 2000   # only upscale if long edge is below this
  scale: 2

faces:
  enabled: true
  model: codeformer     # codeformer | gfpgan
  fidelity: 0.7         # CodeFormer w (higher = more faithful to input)
  blend: 0.6            # final mix of restored face over original
  min_score: 0.8        # YuNet detection score
  small_px: 160         # faces narrower than this are always enhanced
  blur_thresh: 60       # Laplacian variance below this => blurry => enhanced

review:
  copy_flagged: true
  thumb_px: 360

paint:
  enabled: true         # write OUT/paint/<id>_paint.jpg for marking large damage by hand
  scale: 0.5            # paint file size relative to the master
  jpeg_quality: 92

repair:                 # repairs inside user paint (water stains, lost emulsion)
  method: generative    # generative (SDXL inpainting) | recolour (no invention, weaker)
  low_vram: true        # SDXL VAE tiling + attention slicing: ~9.5 GB instead of ~11 GB GPU use
  gen_area: paint       # paint:  regenerate everything painted (people always excluded)
                        # damage: only what looks damaged under the paint (keeps more original,
                        #         but faint tide lines can remain)
  gen_strength: 0.99
  gen_guidance: 7.0
  gen_steps: 30
  gen_pixels: 1048576   # SDXL works at ~1 megapixel
  gen_context: 0.08     # context around the damage given to the model (fraction of size)
  gen_grow: 0.004       # grow the damage a little so tide lines are fully covered
  protect_margin: 0.01  # keep this far (fraction of size) away from people
  work_long: 1000       # analysis resolution (long edge, px)
  ring_gap: 0.01        # reference ring around the paint, as fraction of long edge
  ring_width: 0.06
  palette_k: 6          # colour clusters describing the good image
  colour_dist: 25       # LAB distance that counts as "a different colour"
  w_colour: 0.45        # damage score weights
  w_chroma: 0.25
  w_texture: 0.30
  min_score: 0.35       # never treat pixels below this score as damage
  grow_px: 2            # grow damage to cover the tide line (analysis px)
  fill_texture: 0.35    # texture below this x reference => image gone ...
  fill_dark_L: 18       # ... if also darker than this (LAB L) ...
  fill_light_L: 92      # ... or lighter than this
  stat_sigmas: [0.04, 0.12, 0.3]  # local colour-matching neighbourhoods (fraction of long edge)
  l_strength: 0.5       # how far lightness is moved toward the surroundings (colour: fully)
  max_gain: 2.5         # cap on contrast restored in recoloured areas
  lama_long: 1024       # LaMa working size for large fills
